name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[test,dev,actionlint]"

      - name: Check code formatting (Black)
        run: black --check src tests

      - name: Lint code and scripts (ruff + mypy)
        run: |
          python -m ruff check src tests .github/scripts/
          python -m mypy src tests .github/scripts/ --ignore-missing-imports

      - name: Check README okf_core references are exported
        run: python .github/scripts/check_readme_exports.py

      - name: Lint workflows (actionlint)
        run: actionlint .github/workflows/*.yml

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[test,browser]"

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser oracle tests
        run: pytest tests/test_browser_render.py

  coverage-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run tests with branch coverage
        run: pytest --cov=okf_core --cov-branch --cov-report=xml

      - name: Gate coverage on PR-changed lines
        run: diff-cover coverage.xml --compare-branch=origin/${{ github.event.pull_request.base.ref }} --fail-under=90
