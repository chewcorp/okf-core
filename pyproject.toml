[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "okf-core"
version = "0.5.1"
description = "Reusable Python toolkit for working with Open Knowledge Format bundles."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Russell Heilling", email = "russell@linx.net" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "click >= 8, < 9",
  "markdown-it-py >= 3, < 5",
  "mdformat >= 1.0, < 2",
  "mdformat-gfm >= 1.0, < 2",
  "pluggy >= 1.0, < 2",
  "pydantic >= 2, < 3",
  "PyYAML >= 6, < 7",
  "ruamel.yaml >= 0.18, < 0.20",
  'tomli >= 2.0.0 ; python_version < "3.11"',
]

[project.scripts]
okf = "okf_core.cli:cli"

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "coverage",
  "diff-cover >= 9, < 10",
  "packaging >= 24",
  "hypothesis >= 6, < 7",
  "freezegun >= 1.5, < 2",
]
dev = [
  "black >= 24, < 27",
  "ruff >= 0.9, < 2",
  "mypy >= 2, < 4",
]
browser = [
  "playwright >= 1.40, < 2",
]
actionlint = [
  "actionlint-py >= 1.7, < 2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/okf_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/okf_core"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
]

[tool.black]
target-version = ["py310"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
extend-select = ["C90", "ARG"]

[tool.ruff.lint.mccabe]
max-complexity = 14

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
# Local fake classes in tests mirror sqlite3 connection objects; adding a
# typing_extensions dependency just for `Self` return types isn't worth it.
"tests/test_search.py" = ["PYI034"]
"tests/test_graph.py" = ["PYI034"]
# Test data intentionally includes a naive datetime to exercise tz-less parsing.
"tests/test_frontmatter_patching.py" = ["DTZ001"]

[tool.mypy]
python_version = "3.10"
enable_error_code = ["exhaustive-match"]
