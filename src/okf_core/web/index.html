<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>okf bundle</title>
<link rel="stylesheet" href="/.okf/okf.css">
<script src="/.okf/vendor/markdown-it.min.js"></script>
<script src="/.okf/vendor/markdown-it-anchor.min.js"></script>
<script src="/.okf/vendor/js-yaml.min.js"></script>
<script src="/.okf/adapter.js" defer></script>
</head>
<body>
<header>
  <span id="bundle-label">okf bundle</span>
  <button id="refresh" type="button" title="Re-fetch the current page">Refresh</button>
</header>
<div id="layout">
  <nav id="nav" aria-label="Bundle navigation"></nav>
  <main>
    <div id="status" hidden></div>
    <article id="content"></article>
  </main>
</div>
</body>
</html>
